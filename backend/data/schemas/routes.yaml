table: routes
columns:
  id:
    type: uuid
    primary_key: true
    default: uuid4
  sheet_id:
    type: uuid
    foreign_key: sheets.id
  route_type:
    type: varchar(100)
  length_m:
    type: float
    nullable: true
  confidence_status:
    type: varchar(20)
    default: MEASURED
  confidence_score:
    type: float
    default: 1.0
  layer_id:
    type: uuid
    foreign_key: layers.id
    nullable: true
  source_quality:
    type: varchar(20)
    default: layered_vector
  size_json:
    type: text
    nullable: true
    default: null
