table: spaces
columns:
  id:
    type: uuid
    primary_key: true
    default: uuid4
  sheet_id:
    type: uuid
    foreign_key: sheets.id
  name:
    type: varchar(200)
    nullable: true
  area_m2:
    type: float
    nullable: true
  confidence_status:
    type: varchar(20)
    default: MEASURED
  confidence_score:
    type: float
    default: 1.0
  layer_id:
    type: uuid
    foreign_key: layers.id
    nullable: true
  source_quality:
    type: varchar(20)
    default: layered_vector
