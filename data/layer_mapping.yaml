# Layer-name → assembly-type mapping for vector parsing.
#
# Maps the OCG/layer names found on construction PDFs to the canonical
# assembly rule names in data/assemblies/*.yaml. Adding a new discipline or
# a new vendor's layer naming requires editing THIS FILE ONLY — never source.
#
# Trap compliance:
# - Rules are data-driven (YAML), never hardcoded in source (AGENTS.md §3).
# - Mapping is a rule, not a geometry calculation; humans approve it.
layer_mapping:
  - assembly: lighting_outlet
    layers:
      - E-lt-fix-nm-clg
      - LIGHTING
      - LIGHTING FIXTURES
      - LIGHT
  - assembly: switch
    layers:
      - SWITCHES
      - SWITCH
  - assembly: socket_outlet
    layers:
      - SOCKET
      - SOCKET_OUTLET
      - SOCKETS
  - assembly: power_outlet
    layers:
      - POWER
      - POWER_OUTLET
  - assembly: distribution_board
    layers:
      - DISTRIBUTION_BOARD
      - DB
  - assembly: access_control_door
    layers:
      - access control
      - ACCESS_CONTROL
      - AC
      - SECURITY
      - CARD_READER
  - assembly: cable_tray
    layers:
      - NORMAL TRAY
      - CABLE_TRAY
      - CABLE TRAY
  - assembly: conduit
    layers:
      - CONDUIT
      - CONDUIT_RUN
  - assembly: duct_rectangular
    layers:
      - M-DUCT
      - M-DUCT-RECT
      - DUCT
      - SUPPLY DUCT
      - RETURN DUCT
  - assembly: duct_round
    layers:
      - M-DUCT-RND
      - ROUND DUCT
  - assembly: pipe_insulated
    layers:
      - M-PIPE
      - PIPE
      - CHW PIPE
      - HW PIPE
  - assembly: hvac_equipment
    layers:
      - M-EQPT
      - M-EQPT-NEW
      - M-EQPT-FUTR
      - AHU
      - FCU
      - VAV
  - assembly: sanitary_drainage
    layers:
      - P-SAN-MAIN
      - P-SAN-BRANCH
      - SANITARY
  - assembly: water_supply
    layers:
      - P-DOM-CW
      - P-DOM-HW
      - WATER SUPPLY
  - assembly: vent
    layers:
      - P-VENT
      - VENT PIPE
  - assembly: storm_downpipe
    layers:
      - M_SAUDI_RAIN DOWNPIPE
      - P-STORM
      - DOWNPIPE
  - assembly: sprinkler_branch
    layers:
      - FP-SPRK-BRANCH
      - SPRINKLER PIPE
  - assembly: standpipe
    layers:
      - FP-STANDPIPE
      - STANDPIPE
  - assembly: sprinkler_head
    layers:
      - FP-SPRK-HEADS
      - SPRINKLER HEAD
  - assembly: hose_cabinet
    layers:
      - FP-HOSE-CAB
      - HOSE CABINET
  - assembly: smoke_detector
    layers:
      - FA-DETECTOR
      - FIRE ALARM DETECTOR
  - assembly: call_point
    layers:
      - FA-CALLPOINT
      - FIRE ALARM CALLPOINT
  - assembly: sounder
    layers:
      - FA-SOUNDER
      - FIRE ALARM SOUNDER
  - assembly: facp
    layers:
      - FA-FACP
      - FIRE ALARM PANEL
