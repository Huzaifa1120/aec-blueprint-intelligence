# OCG layer-name → discipline classification (spec v3 §7.3).
#
# Ordered list, FIRST MATCH WINS. The terminal '.*' → unclassified rule must
# stay last. Every OCG on a sheet is classified against these regexes and
# persisted as a LayerRow; humans may correct the result in the review UI.
#
# Trap compliance: rules are data-driven (YAML), never hardcoded in source.
# Adding a discipline or a new layer naming convention is an edit to THIS
# FILE ONLY — never code.
layer_classification_rules:
  - pattern: '^(M_SAUDI_(WALL|DOOR|STAIRS|ROOM|AREAS)|M-PART-GLZW)'
    discipline: architectural
  - pattern: '^(E-|ADO |FIRE ALARM|NORMAL TRAY|access control)'
    discipline: electrical
  - pattern: '^(M-DUCT|M-PIPE|M-EQPT)'
    discipline: mechanical
  - pattern: '^M_SAUDI_(WATER_INSULATING|VENT_identy|RAIN)'
    discipline: envelope
  - pattern: '^M_SAUDI_(MAT|METAL|PATT|NPLT|PRPT|AGRAF|DOT|ACCESSORY|HIDDEN)'
    discipline: material_rendering   # non-structural
  - pattern: '.*'
    discipline: unclassified
