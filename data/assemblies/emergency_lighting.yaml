bom:
  emergency_fixture: 1.0
  battery_backup: 1.0
  wiring: 0.5
  mounting_bracket: 1.0
labor:
  installation_hours: 0.5
  hourly_rate: 45.00
  category: electrical
waste_factor: 0.10
