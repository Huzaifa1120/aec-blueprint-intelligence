name: emergency_lighting
rule_version: "1.0.0"
legend_keywords:
  - EMERGENCY
  - EM
  - EMERGENCY EXIT
  - EMERGENCY LIGHTING
  - CENTRAL BATTERY
  - CB
  - BATTERY BACKUP
  - EXIT SIGN
  - ESCAPE ROUTE
description: Emergency lighting fixtures with battery backup, including exit signs and maintained/emergency luminaires
fixture_types:
  - tag_pattern: "EM[0-9]+"
    description: Emergency exit signs and luminaires
  - tag_pattern: "[A-Z][0-9]+CB"
